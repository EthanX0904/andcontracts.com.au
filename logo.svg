<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 140" width="500" height="140">
  <!-- Monogram mark -->
  <rect x="0" y="0" width="70" height="70" rx="8" fill="#1c1c1c"/>
  <text x="35" y="48" font-family="'DM Sans', Arial, sans-serif" font-size="36" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="-2">A</text>
  <!-- Connecting line -->
  <line x1="70" y1="35" x2="105" y2="35" stroke="#ddd" stroke-width="1.5"/>
  <!-- C monogram -->
  <rect x="105" y="0" width="70" height="70" rx="8" fill="none" stroke="#1c1c1c" stroke-width="2"/>
  <text x="140" y="48" font-family="'DM Sans', Arial, sans-serif" font-size="36" font-weight="700" fill="#1c1c1c" text-anchor="middle" letter-spacing="-1">C</text>

  <!-- Text -->
  <text x="16" y="100" font-family="'DM Sans', Arial, sans-serif" font-size="32" font-weight="700" fill="#1c1c1c" letter-spacing="0.5">AND CONTRACTS</text>
  <text x="16" y="122" font-family="'DM Sans', Arial, sans-serif" font-size="11" fill="#bbb" letter-spacing="2" text-transform="uppercase">Contract Logistics · Australia</text>
</svg>

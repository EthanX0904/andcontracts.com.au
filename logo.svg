<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3a5c"/>
      <stop offset="100%" style="stop-color:#2d6da8"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c8a45c"/>
      <stop offset="100%" style="stop-color:#d4b06a"/>
    </linearGradient>
  </defs>

  <!-- Icon: Stylized connector/arrow + warehouse shape -->
  <g transform="translate(10, 10)">
    <!-- Building/warehouse shape -->
    <rect x="0" y="55" width="75" height="45" rx="4" fill="url(#g1)" opacity="0.9"/>
    <rect x="15" y="65" width="18" height="35" rx="2" fill="#fff" opacity="0.85"/>
    <rect x="42" y="65" width="18" height="35" rx="2" fill="#fff" opacity="0.85"/>
    <!-- Roof -->
    <polygon points="-2,55 37,30 77,55" fill="url(#g2)" opacity="0.95"/>
    <!-- Arrow across representing logistics flow -->
    <line x1="0" y1="78" x2="75" y2="78" stroke="#c8a45c" stroke-width="3" opacity="0.6"/>
    <polygon points="72,72 82,78 72,84" fill="#c8a45c" opacity="0.8"/>
    <!-- Small globe dots (global reach) -->
    <circle cx="37" cy="90" r="3" fill="#c8a45c" opacity="0.5"/>
    <circle cx="55" cy="86" r="2" fill="#c8a45c" opacity="0.4"/>
  </g>

  <!-- Company Name -->
  <text x="105" y="52" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700" fill="#1a3a5c" letter-spacing="2">AND</text>
  <text x="105" y="78" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700" fill="#1a3a5c" letter-spacing="2">CONTRACTS</text>
  <text x="105" y="102" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#888" letter-spacing="4">PTY LTD</text>

  <!-- Tagline -->
  <text x="105" y="117" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#c8a45c" letter-spacing="2.5">INTEGRATED CONTRACT LOGISTICS</text>
</svg>
